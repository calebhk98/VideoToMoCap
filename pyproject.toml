[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "videotomocap"
version = "0.1.0"
description = "Turn hours of personal video into anonymized SMPL motion-capture data for training a personal motion model."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.21", "pyyaml>=5.4"]

[project.scripts]
videotomocap = "videotomocap.cli:main"

[tool.setuptools.packages.find]
include = ["videotomocap*"]
