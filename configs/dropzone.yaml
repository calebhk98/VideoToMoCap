# Convenience config: process whatever is dropped into ./dropzone
# Usage: python -m videotomocap --config configs/dropzone.yaml scan
#
# For a GPU-free dry run of the whole flow, set `backend: noop` below.

footage_root: dropzone
work_root: work
video_exts: [".mp4", ".mov", ".mkv", ".avi", ".m4v", ".ts"]
camera_dir_depth: 1

# --- HMR backend ---
# Set to your installed method. `noop` needs nothing (synthetic, for dry runs).
backend: gvhmr
backend_repo: /opt/GVHMR
backend_python: /opt/miniconda3/envs/gvhmr/bin/python

# List truly-fixed cameras (top-folder names) to skip visual odometry.
static_cameras: []

# Cameras that only see part of the body -> clips tagged `partial_body`.
partial_body_cameras: []

# --- Parallelism (scale across GPUs) ---
gpus: auto                 # 'auto' detects your GPUs; or list e.g. ["0","1"]
workers_per_gpu: 1         # raise to 2-3 to pack more clips onto each card

# --- Anonymization ---
drop_shape: true
keep_translation: true
use_frame: global

# --- Dataset ---
target_fps: 30.0
min_clip_frames: 30
val_fraction: 0.05
gender: neutral
