# Example pipeline config. Copy and edit for your machine.
# Every key maps to a field on videotomocap.config.PipelineConfig.

# --- Ingestion -------------------------------------------------------------
footage_root: /data/security_footage      # tree of per-camera folders
work_root: work                            # all outputs land here
video_exts: [".mp4", ".mov", ".mkv"]
camera_dir_depth: 1                        # footage/<camera>/<date>/clip.mp4

# --- HMR backend -----------------------------------------------------------
# Body-only: gvhmr|wham|tram. Whole-body SMPL-X (hands): smplestx|whac|osx|
# hand4whole|multihmr. Combined: fusion (see configs/fusion_hands.yaml). noop=test.
backend: gvhmr
backend_repo: /opt/GVHMR                   # cloned upstream checkout
backend_python: /opt/miniconda3/envs/gvhmr/bin/python
backend_extra_args: []

# Corner/eye-level cameras that never move -> skip visual odometry (GVHMR -s).
# Rotating/pan cameras: leave OUT of this list so SLAM/VO handles the motion.
static_cameras:
  - cam01_corner
  - cam02_corner

# Body parts a camera can't reliably see -> those joints are tagged unreliable
# (HMR-inferred, not observed) per clip, and a joint_valid mask flows to the
# dataset so you can filter/mask them. Regions: legs|left_leg|right_leg|feet|
# arms|left_arm|right_arm|hands|head (see videotomocap/regions.py).
camera_occlusions: {}
#  cam_desk: [legs]      # waist-up view
#  cam_high: [head]      # head cropped
partial_body_cameras: []   # shorthand: same as camera_occlusions {cam: [legs]}

# --- Parallelism -----------------------------------------------------------
gpus: auto                 # 'auto' detects your GPUs; or list explicitly ["0","1"]
workers_per_gpu: auto      # 'auto' sizes N from free VRAM (calibrates clip 0), or an int
# vram_per_worker_mb:      # set to skip calibration (VRAM one clip needs, MiB)
vram_headroom_mb: 2000     # always leave this much free per card
max_workers_per_gpu: 8     # ceiling for auto sizing
# workers:                 # override the total worker count directly

# --- Anonymization ---------------------------------------------------------
drop_shape: true          # discard SMPL betas -> no body identity leaves here
keep_translation: true    # keep world trajectory (needed for grounded motion)
use_frame: global         # 'global' = world-grounded, 'incam' = camera-relative
refine: false             # true = temporal de-jitter + anti-drift post-processing

# --- Dataset ---------------------------------------------------------------
target_fps: 30.0
min_clip_frames: 30       # drop motion snippets shorter than 1 s
val_fraction: 0.05
gender: neutral
