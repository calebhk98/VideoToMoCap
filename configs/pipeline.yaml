# Example pipeline config. Copy and edit for your machine.
# Every key maps to a field on videotomocap.config.PipelineConfig.

# --- Ingestion -------------------------------------------------------------
footage_root: /data/security_footage      # tree of per-camera folders
work_root: work                            # all outputs land here
video_exts: [".mp4", ".mov", ".mkv"]
camera_dir_depth: 1                        # footage/<camera>/<date>/clip.mp4

# --- HMR backend -----------------------------------------------------------
# Body-only: gvhmr|wham|tram. Whole-body SMPL-X (hands): smplestx|whac|osx|
# hand4whole|multihmr. Combined: fusion (see configs/fusion_hands.yaml). noop=test.
backend: gvhmr
backend_repo: /opt/GVHMR                   # cloned upstream checkout
backend_python: /opt/miniconda3/envs/gvhmr/bin/python
backend_extra_args: []

# Corner/eye-level cameras that never move -> skip visual odometry (GVHMR -s).
# Rotating/pan cameras: leave OUT of this list so SLAM/VO handles the motion.
static_cameras:
  - cam01_corner
  - cam02_corner

# Cameras that only see part of the body (e.g. a waist-up desk view). Clips from
# these are tagged `partial_body` in the manifest -- their out-of-frame joints
# (legs) are HMR-inferred, not observed. Filter/down-weight them downstream.
partial_body_cameras: []

# --- Parallelism -----------------------------------------------------------
workers: 2                                 # clips processed at once (~= #GPUs)
gpus: ["0", "1"]                            # one clip pinned per GPU, round-robin

# --- Anonymization ---------------------------------------------------------
drop_shape: true          # discard SMPL betas -> no body identity leaves here
keep_translation: true    # keep world trajectory (needed for grounded motion)
use_frame: global         # 'global' = world-grounded, 'incam' = camera-relative

# --- Dataset ---------------------------------------------------------------
target_fps: 30.0
min_clip_frames: 30       # drop motion snippets shorter than 1 s
val_fraction: 0.05
gender: neutral
